<?xml version="1.0" encoding="UTF-8"?>
<!-- Sphaera Commander: две панели + сфера — айдентика Iustitia
     (графит #090b0c, пергамент #f4efe6, бирюза #2f8f8b/#5fbab4, бронза #a6784f) -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="30" fill="#090b0c"/>
  <rect x="5" y="5" width="246" height="246" rx="27" fill="none"
        stroke="#2f8f8b" stroke-opacity="0.35" stroke-width="2"/>

  <!-- левая панель (активная) -->
  <rect x="34" y="44" width="88" height="142" rx="8" fill="#171c1d"
        stroke="#2a3133" stroke-width="2"/>
  <path d="M 34 52 a 8 8 0 0 1 8 -8 h 72 a 8 8 0 0 1 8 8 v 16 h -88 Z" fill="#2f8f8b"/>
  <rect x="46" y="86" width="64" height="9" rx="4.5" fill="#f4efe6" opacity="0.9"/>
  <rect x="46" y="104" width="48" height="9" rx="4.5" fill="#f4efe6" opacity="0.55"/>
  <rect x="46" y="122" width="58" height="9" rx="4.5" fill="#f4efe6" opacity="0.55"/>
  <rect x="46" y="140" width="40" height="9" rx="4.5" fill="#a6784f" opacity="0.95"/>
  <rect x="46" y="158" width="52" height="9" rx="4.5" fill="#f4efe6" opacity="0.35"/>

  <!-- правая панель (неактивная) -->
  <rect x="134" y="44" width="88" height="142" rx="8" fill="#111516"
        stroke="#2a3133" stroke-width="2"/>
  <path d="M 134 52 a 8 8 0 0 1 8 -8 h 72 a 8 8 0 0 1 8 8 v 16 h -88 Z" fill="#2a3133"/>
  <rect x="146" y="86" width="64" height="9" rx="4.5" fill="#f4efe6" opacity="0.35"/>
  <rect x="146" y="104" width="46" height="9" rx="4.5" fill="#f4efe6" opacity="0.25"/>
  <rect x="146" y="122" width="54" height="9" rx="4.5" fill="#f4efe6" opacity="0.25"/>

  <!-- сфера: связывает панели, сигнатура «Sphaera» -->
  <circle cx="128" cy="200" r="19" fill="#090b0c" stroke="#5fbab4" stroke-width="6"/>
  <ellipse cx="128" cy="200" rx="19" ry="7.5" fill="none"
           stroke="#5fbab4" stroke-width="2.5" opacity="0.75"/>
  <circle cx="128" cy="200" r="5.5" fill="#a6784f"/>
</svg>
