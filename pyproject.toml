[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphaera-commander"
version = "0.13.1"
description = "Двухпанельный файловый менеджер для Linux в духе Total Commander"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.8", "pypdfium2", "pypdf", "python-docx", "mammoth", "openpyxl", "python-pptx", "xlrd", "xlwt", "striprtf"]

[project.scripts]
sphaera-commander = "sphaera_commander.app:main"

[tool.setuptools]
packages = ["sphaera_commander"]

[tool.setuptools.package-data]
sphaera_commander = ["assets/*"]
